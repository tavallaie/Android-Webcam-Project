name: Release clients

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  android:
    name: Build Android client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Build release APK
        run: ./scripts/build-android.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: release/android/*.apk
          if-no-files-found: error

  linux:
    name: Build Linux clients
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libv4l-dev \
            pkg-config \
            clang \
            cmake \
            libssl-dev \
            build-essential \
            xdg-utils \
            software-properties-common

      - name: Install FFmpeg 8
        run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg8
          sudo apt-get update
          sudo apt-get install -y -t "o=LP-PPA-ubuntuhandbook1-ffmpeg8" \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev

      - name: Build DEB and AppImage
        run: ./scripts/build-linux-client.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: |
            release/linux/*.deb
            release/linux/*.AppImage
          if-no-files-found: error

  windows:
    name: Build Windows client
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build MSI and NSIS installers
        working-directory: desktop
        run: pnpm tauri build --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-client
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    if: always() && needs.android.result == 'success' && needs.linux.result == 'success'
    needs:
      - android
      - linux
      - windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-client"
          path: release-assets
          merge-multiple: true

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --generate-notes \
            "${assets[@]}"
